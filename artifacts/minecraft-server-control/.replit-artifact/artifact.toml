kind = "mobile"
previewPath = "/"
title = "Minecraft Server Control"
description = "Eine polished mobile Control Plane für Minecraft-Netzwerke mit Serverzuständen, Live-Konsole, Schnellaktionen, Spieler-Tools und Hetzner-Ressourcen."
version = "1.0.0"
id = "artifacts/minecraft-server-control"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18739

[services.development]
run = "pnpm --filter @workspace/minecraft-server-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/minecraft-server-control", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/minecraft-server-control", "run", "serve" ]

[services.env]
PORT = "18739"
BASE_PATH = "/"
